<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cin Cin Club | Girls' community in Milan</title>
  <meta name="description" content="Cin Cin Club is a girls' community in Milan: aperitivos, dinners and walks. A club created by girls, open to everyone.">
  <meta name="theme-color" content="#BFDDF2">

  <!-- Font da Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Fraunces:ital,wght@0,600;1,500&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- HEADER-->
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="#top"><img src="images/logo.png" alt="Cin Cin Club - home"></a>
      <nav class="nav" aria-label="Main">
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#faq">FAQ</a>
        <a class="btn" href="#join">Join WhatsApp</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- HERO-->
    <section id="top" class="hero">
      <div class="wrap split">
        <div class="hero-text">
          <h1>A little bit messy. <span class="hot">A lot of memories.</span></h1>
          <p class="lead">Aperitivos, dinners and walks for girls who are new in town, or just want new friends. Come alone, leave with new friends.</p>
          <a class="btn" href="#join">Join the community</a>
        </div>

        <!-- Collage: un riquadro con proporzioni fisse, dentro foto e sticker -->
        <div class="collage collage-hero">
          <div class="photo c-duomo">
            <img src="images/duomo.jpg" alt="The Duomo of Milan lit by the sunset between two buildings">
            <img class="tape" src="images/scotch.png" alt="">
          </div>
          <img class="sticker c-disco" src="images/disco.png" alt="">
          <img class="sticker c-girls" src="images/girls-sticker.png" alt="Sticker: girls just wanna have fun">
          <img class="sticker c-camera" src="images/camera.png" alt="A camera whose screen shows a hand holding a glass of wine on a shoe">
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer"></footer>

</body>
</html>
